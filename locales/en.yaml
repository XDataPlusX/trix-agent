    label_fast:            "faster, costs more"
    label_normal:          "standard price"
    status_fast:           "faster (costs more)"
    status_normal:         "standard"
    picker_title:          "⚡ **Faster responses (costs more)**\n\nCurrent mode: `{mode}`\n\nPick an option:"
    choice_fast:           "fast — quicker replies, costs more"
    choice_normal:         "normal — standard speed and price"


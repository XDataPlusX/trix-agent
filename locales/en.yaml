    unknown_arg:               "⚠️ Unknown argument: `{arg}`\n\n**Valid levels:** none, minimal, low, medium, high, xhigh, max, ultra\n**Display:** show, hide\n**Persist:** add `--global` to save beyond this session"
    picker_title:              "🧠 **Response thinking depth**\n\n**Level:** `{level}`\n**Scope:** {scope}\n**Display:** {display}\n\nHigher is more accurate but costs more and takes longer; lower is faster and cheaper.\n\nPick an option:"

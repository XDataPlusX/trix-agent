  session_reset:
    # Разговор начинается заново. Апстрим тут говорил «Conversation history
    # cleared» и отправлял править config.yaml — файл, до которого клиент не
    # дотягивается: он общается с агентом только через Telegram. Разговор при
    # этом никуда не девается: старая строка в state.db закрывается причиной
    # session_reset, а не удаляется.
    #
    # Вторая дорога («попросите — поищу») есть в КАЖДОМ из четырёх текстов,
    # и не для красоты: /resume отсеивает разговоры без заголовка, поэтому
    # безымянный разговор не появится в списке НИКОГДА — ни первым, ни
    # десятым. Обещание «вернуть его: /resume» в одиночку необеспечено.
    # Поиск по прошлым разговорам у клиента включён (тулсет session_search),
    # поэтому «попросите — поищу» продукт выполняет.
    # (Прежнее обоснование «у клиента с десятком тем нужный не попадёт в
    # десятку» неверно: ключ сессии включает идентификатор темы, у каждой
    # темы свои десять слотов.)
    idle: "🕓 Здесь мы не общались {duration} — начинаю новый разговор, чтобы не тащить в него уже неактуальное.\nПрежний сохранён: /resume покажет последние разговоры и вернёт нужный. Если его там нет — просто попросите меня, я поищу по прошлым."
    suspended: "⏹️ Прежний разговор был остановлен — продолжаю с чистого листа.\nВернуть остановленный: /resume. Если его там нет — просто попросите меня, я поищу по прошлым."
    restart: "🔌 Я перезапускался и не успел восстановить прошлый разговор — начинаю новый.\nПрежний сохранён: /resume вернёт его. Если его там нет — просто попросите меня, я поищу по прошлым."

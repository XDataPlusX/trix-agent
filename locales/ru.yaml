  topic:
    root_lobby: "Этот основной чат зарезервирован для системных команд.\n\nЧтобы начать новый чат, откройте раздел All Messages вверху интерфейса бота и отправьте туда любое сообщение. Telegram создаст для него отдельную тему; каждая тема работает как независимая сессия."
    root_new: "Чтобы начать новый параллельный чат, откройте раздел All Messages вверху интерфейса бота и отправьте туда любое сообщение. Telegram создаст для него отдельную тему.\n\nКаждая тема — независимая сессия. Используйте /new внутри существующей темы, только если хотите заменить текущую сессию этой темы."
    new_header: "В этой теме начата новая сессия.\n\nСовет: для параллельной работы откройте All Messages и отправьте сообщение туда — так создастся отдельная тема вместо /new здесь. /new заменяет сессию, привязанную к текущей теме."
    system_title: "Система"
    system_intro: "Системная тема для команд и статуса."
    title_fallback: "Чат"
    help_text: "/topic — включить режим нескольких сессий в личке (один бот, много параллельных чатов)\n\nИспользование:\n  /topic             Включить режим тем или показать статус, если уже включён\n  /topic help        Показать эту справку\n  /topic off         Отключить режим тем и очистить привязки тем\n  /topic <id>        Внутри темы: восстановить прошлую сессию по её ID\n\nКак это работает:\n1. Один раз выполните /topic в этой личке — агент проверит, включены ли\n   в BotFather настройки Threads Settings, и включит режим нескольких сессий.\n2. Нажмите All Messages вверху бота и отправьте любое сообщение.\n   Telegram создаст для него новую тему; каждая тема — это\n   независимая сессия (своя история, свой контекст).\n3. Корневая личка становится системным лобби — отправляйте туда /topic,\n   /status, /help, /usage. Обычные запросы отправляются в теме.\n4. /new внутри темы сбрасывает только сессию этой темы.\n5. /topic <id> внутри темы восстанавливает в неё прошлую сессию."

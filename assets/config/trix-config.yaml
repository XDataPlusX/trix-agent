# Trix Agent — конфигурация. Здесь ВСЕ настройки агента, целиком.
#
# Файл устроен так: сначала — то, что мы настроили под продукт, каждая
# настройка с объяснением, почему именно так. Ниже, без комментариев, —
# всё остальное на стандартных значениях. Менять можно любую строку в
# любой части файла: правка вступает в силу после перезапуска агента
# (hermes gateway restart).
#
# Одно значение можно посмотреть и поменять, не открывая файл:
#   hermes config get terminal.backend
#   hermes config set terminal.backend docker
# Комментарии при этом сохраняются — правится только нужная строка.
#
# Секреты (ключи, токены, пароли) сюда не пишутся — они в .env рядом.

# Часовой пояс, в котором агент считает время. По нему срабатывают
# напоминания и задачи по расписанию: «напомни в 9 утра» — это девять
# утра здесь, а не там, где стоит сервер.
#
# Пусто — берётся время самого сервера, а оно обычно не совпадает с
# вашим. Поле заполняется в мастере настройки; заполнить его стоит до
# того, как вы заведёте первую задачу: уже сохранённые задачи остаются
# на прежнем времени, смена пояса их не переносит.
#
# Название пояса — из стандартного списка, например Europe/Moscow,
# Europe/Kaliningrad, Asia/Yekaterinburg, Asia/Vladivostok.
timezone: ""

terminal:
  # Команды агента выполняются в отдельном Docker-контейнере, а не на самой
  # машине. Ваши рабочие файлы и .env с ключами агенту недоступны, пока вы
  # не смонтируете их явно.
  backend: docker
  # Рабочий каталог агента внутри контейнера. Всё, что агент создаёт,
  # сохраняется между разговорами.
  cwd: /workspace
  # Ресурсы песочницы рассчитаны на базовый тариф: 4 CPU, 8 ГБ RAM.
  # На машине с другими характеристиками пересчитайте так: песочнице
  # отдаём меньше половины памяти, остальное нужно хосту — браузеру,
  # распознаванию речи и самому Docker.
  # 3 ГБ песочнице: этого хватает на сборку проекта внутри неё и остаётся
  # запас хосту на браузер, распознавание речи и сам Docker.
  container_memory: 3072
  # 2 ядра из 4. Одно ядро тормозило бы любую многопоточную сборку до
  # скорости однопоточной, четыре — отняли бы процессор у самого агента.
  container_cpu: 2
  # Десять портов, на которых агент может показать сделанное — сайт,
  # демо, страницу. Всё, что он на них поднимет, доступно из интернета
  # без пароля, поэтому агент обязан говорить об этом вслух.
  # Числа высокие намеренно: на привычные (3000, 8080, 5432) инструменты
  # садятся сами, и наружу выехало бы то, что агент поднял для себя.
  # Диапазон применяется при создании контейнера: чтобы он появился на уже
  # работающей установке, песочницу надо пересоздать (рабочая папка при
  # этом не страдает — она лежит на диске машины, а не в контейнере).
  docker_extra_args:
    - -p
    - 18000-18009:18000-18009
  modal_mode: auto
  degraded_mode: warn
  font_family: ''
  timeout: 180
  daemon_term_grace_seconds: 2.0
  env_passthrough: []
  home_mode: auto
  shell_init_files: []
  auto_source_bashrc: true
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  docker_forward_env: []
  docker_env: {}
  singularity_image: docker://nikolaik/python-nodejs:python3.11-nodejs20
  modal_image: nikolaik/python-nodejs:python3.11-nodejs20
  daytona_image: nikolaik/python-nodejs:python3.11-nodejs20
  vercel_runtime: node24
  container_disk: 51200
  container_persistent: true
  docker_volumes: []
  docker_mount_cwd_to_workspace: false
  docker_network: true
  docker_shm_size: 1g
  docker_run_as_host_user: false
  persistent_shell: true

web:
  # Поиск через DuckDuckGo: не требует ни ключа, ни отдельного сервиса.
  search_backend: ddgs
  backend: ''
  extract_backend: ''
  extract_char_limit: 15000

browser:
  # "off" = встроенные инструменты браузера поверх локального Chromium,
  # который поставил установщик. Пустое значение здесь означало бы другой
  # режим (Browser Use CLI), который требует отдельного ключа.
  backend: "off"
  inactivity_timeout: 120
  command_timeout: 30
  record_sessions: false
  headed: false
  allow_private_urls: false
  engine: auto
  auto_local_for_private_urls: true
  cdp_url: ''
  allow_unsafe_evaluate: false
  restrict_evaluate: false
  dialog_policy: must_respond
  dialog_timeout_s: 300
  camofox:
    managed_persistence: false
    user_id: ''
    session_key: ''
    adopt_existing_tab: false
    rewrite_loopback_urls: false
    loopback_host_alias: host.docker.internal

gateway:
  # Сколько часов хранятся файлы, прошедшие через чат.
  media_retention_hours:
    # Картинки, голосовые, видео и скриншоты страниц — рабочий мусор, он и
    # без этого файла удаляется через сутки (встроенное поведение).
    # А присланные вами ДОКУМЕНТЫ (файлы-вложения, не фото и не голосовые
    # сообщения) не удаляются никогда: 0 означает "хранить". Место они
    # занимают на диске машины — если его станет мало, поставьте сюда
    # число часов.
    documents: 0
    default: 24
  multiplex_profile_allowlist:
  delivery_ledger: true
  platform_connect_timeout: 30
  loop_watchdog: true
  write_sessions_json: true
  scale_to_zero:
    idle_timeout_minutes: 5
  restart_loop_guard:
    max_restarts: 3
    window_seconds: 60
    max_gap_seconds: 300
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  message_timestamps:
    enabled: false
  max_inbound_media_bytes: 134217728
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  api_server:
    max_concurrent_runs: 10

session_reset:
  # Когда разговор в теме начинается заново.
  # Каждая тема в группе Telegram — отдельный разговор. По умолчанию агент
  # не начинает их заново никогда, и у заброшенной темы это выходит боком:
  # она навсегда остаётся живым разговором, в который агент продолжает
  # тащить всё, что там когда-то обсуждалось.
  # "idle" = смотрим только на молчание. Ежедневного рубежа здесь намеренно
  # нет: он обрывал бы тему посреди работы — вернулись к ней наутро, а
  # разговор уже начат с чистого листа.
  mode: idle
  # Трое суток молчания (4320 минут). Не двое: пятница вечер — понедельник
  # утро это 64 часа, и при двух сутках рабочая тема начиналась бы заново
  # каждые выходные.
  # Прежний разговор при этом не пропадает — он сохраняется целиком. Агент
  # скажет в теме, что начинает новый, и подскажет, как вернуть прежний
  # (/resume, а если его нет в списке — попросить поискать по прошлым).
  idle_minutes: 4320

tts:
  edge:
    # Русский голос. По умолчанию Edge читает английским.
    voice: ru-RU-SvetlanaNeural
  provider: edge
  elevenlabs:
    voice_id: pNInz6obpgDQGcFmaJgB
    model_id: eleven_multilingual_v2
  openai:
    model: gpt-4o-mini-tts
    voice: alloy
  gemini:
    model: gemini-2.5-flash-preview-tts
    voice: Kore
    audio_tags: false
    persona_prompt_file: ''
  xai:
    voice_id: eve
    language: en
    speed: 1.0
    auto_speech_tags: false
    optimize_streaming_latency: 0
    sample_rate: 24000
    bit_rate: 128000
  mistral:
    model: voxtral-mini-tts-2603
    voice_id: c69964a6-ab8b-4f8a-9465-ec0925096ec8
  minimax:
    model: speech-02-hd
    voice_id: English_expressive_narrator
  kittentts:
    model: KittenML/kitten-tts-nano-0.8-int8
    voice: Jasper
  neutts:
    ref_audio: ''
    ref_text: ''
    model: neuphonic/neutts-air-q4-gguf
    device: cpu
  piper:
    voice: en_US-lessac-medium
  deepinfra:
    model: ''
    voice: default

display:
  # Что клиент видит в Telegram, пока агент работает.
  # Ответ приходит одним готовым сообщением, а не печатается по буквам:
  # редактирование сообщения на каждом токене выглядит дёрганым и упирается
  # в ограничения Telegram на частоту правок.
  platforms:
    telegram:
      streaming: false
    discord:
      streaming: false
    slack:
      streaming: false
  # Поток "читаю файл / ищу в сети" по каждому шагу выключен — в мессенджере
  # это шум.
  tool_progress: "off"
  # Промежуточные реплики агента — его собственные слова между действиями —
  # тоже выключены: в чат приходит один готовый ответ, а не размышления по
  # дороге к нему.
  #
  # Что при этом остаётся признаком работы: индикатор "печатает…" и, если
  # агент занят дольше трёх минут, служебное сообщение вида
  # "⏳ 3 мин — читаю файл" (оно удаляется вместе с приходом ответа,
  # см. cleanup_progress ниже).
  interim_assistant_messages: false
  # Пока агент занят долгим шагом, раз в три минуты в чат приходит служебное
  # сообщение вида "⏳ 3 мин — читаю файл" (сам интервал настраивается
  # отдельно, agent.gateway_notify_interval, здесь его не трогаем). Эта
  # настройка удаляет такие сообщения, как только приходит готовый ответ:
  # чат не зарастает следами работы. Если ход упал, они остаются — по ним
  # видно, на чём остановилось.
  cleanup_progress: true
  compact: false
  personality: ''
  resume_display: full
  resume_exchanges: 10
  resume_max_user_chars: 300
  resume_max_assistant_chars: 200
  resume_max_assistant_lines: 3
  resume_skip_tool_only: true
  busy_input_mode: interrupt
  busy_steer_ack_enabled: true
  interface: cli
  tui_auto_resume_recent: false
  tui_agents_nudge: true
  bell_on_complete: false
  # Показывать ли клиенту размышления модели («💭 Reasoning» перед ответом).
  # Выключено намеренно, решение владельца 2026-09-10: клиент разговаривает
  # с ботом, а не читает его черновик.
  #
  # Значение важно задать ЗДЕСЬ, а не полагаться на встроенное: в продукте
  # две таблицы умолчаний, и они расходятся. DEFAULT_CONFIG отвечает за CLI
  # и включает показ; шлюз (gateway/display_config.py) для мессенджеров
  # выключает. Пока шаблон был дельтой и ключа в нём не было, выигрывал
  # шлюз. С полным шаблоном ключ появился со значением для CLI — и на
  # клиентской машине 81.222.148.68 бот начал печатать свои размышления
  # в Telegram.
  show_reasoning: false
  reasoning_full: false
  memory_notifications: "on"
  streaming: false
  timestamps: false
  timestamp_format: '%H:%M'
  final_response_markdown: strip
  persistent_output: true
  persistent_output_max_lines: 200
  persist_prompts: true
  inline_diffs: true
  file_mutation_verifier: true
  credits_notices: true
  turn_completion_explainer: true
  show_cost: false
  battery: false
  focus_view: false
  focus_saved_tool_progress: all
  skin: trix
  language: ru
  tui_status_indicator: kaomoji
  cli_refresh_interval: 1.0
  user_message_preview:
    first_lines: 2
    last_lines: 2
  show_commentary: true
  tool_progress_command: false
  tool_preview_length: 0
  friendly_tool_labels: true
  turn_summary: true
  spinner_token_flow: true
  tool_progress_grouping: accumulate
  status_phrases: {}
  reasoning_style: code
  ephemeral_system_ttl: 0
  runtime_footer:
    enabled: false
    fields:
      - model
      - context_pct
      - cwd
  copy_shortcut: auto
  pet:
    enabled: false
    slug: ''
    render_mode: auto
    scale: 0.33
    unicode_cols: 0

approvals:
  # Когда агент спрашивает разрешения.
  # Команды агент выполняет в отдельном контейнере, где ломать нечего, —
  # поэтому подтверждений почти нет. Единственное исключение: удаление в
  # рабочей папке. Её содержимое живёт на диске машины и восстановлению не
  # подлежит, поэтому перед удалением агент спрашивает вас.
  # В задачах по расписанию, где вас некому спросить, удаление не
  # выполняется вовсе: агент получает отказ и ищет другой путь.
  # Правка и перезапись файлов подтверждений не требуют — это обычная
  # работа агента.
  mode: manual
  # Сколько секунд ждать вашего ответа. Молчание считается отказом: агент
  # не станет удалять и не будет пытаться сделать это другим способом.
  timeout: 300
  cron_mode: deny
  smart_policy: ''
  denial_breaker_threshold: 3
  deny: []
  mcp_reload_confirm: true
  destructive_slash_confirm: true

tool_loop_guardrails:
  # Что делать, если агент заклинило: он раз за разом повторяет один и тот
  # же вызов, который каждый раз возвращает ошибку.
  # Встроенное поведение — только предупредить: предупреждение читает сама
  # модель и решает, послушаться ли. В консоли это разумно: там сидит
  # человек и видит происходящее. У вас в Telegram видно только молчание,
  # поэтому круг обрывается принудительно: после пяти одинаковых неудач
  # подряд (или восьми неудач одного и того же инструмента) ход
  # прекращается, и агент отвечает тем, что успел выяснить.
  # Успешные действия счётчик не трогают — длинная честная работа под
  # ограничение не попадает.
  hard_stop_enabled: true
  warnings_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
  loop_caps:
    max_web_searches: 50
    max_subagents: 50

platform_hints:
  telegram:
    # Текст добавляется к инструкциям агента в каждом разговоре в Telegram.
    # Держать коротким: он отправляется модели с каждым сообщением.
    append: >
      Твоя постоянная рабочая папка — /workspace: сохраняется между
      разговорами, перезапусками и обновлениями, держи в ней всё важное.
      Присланные в чат файлы доступны только на чтение — чтобы работать с
      файлом, скопируй его в рабочую папку. Большой объём удобнее получать
      по ссылке и сразу сохранять в /workspace. Порты 18000-18009 открыты
      в интернет без пароля: сервис поднимай на 0.0.0.0, а не на
      localhost, иначе снаружи он не откроется. Назови собеседнику адрес и
      скажи, что он публичный. Удаление в рабочей папке требует
      подтверждения собеседника — предупреди до того, как удалять.

agent:
  agent_cache:
    # Потолок памяти самого шлюза, после которого он начинает выгружать
    # давние разговоры из памяти (они остаются на диске и подтянутся
    # обратно при следующем сообщении). По умолчанию стоит "auto" = 65 %
    # от всей памяти машины, то есть 5,3 ГБ на тарифе 8 ГБ — вместе с
    # песочницей это больше, чем есть на машине. 2,5 ГБ держит сумму в
    # рамках. Пересчитайте, если тариф другой.
    memory_high_mb: 2560
    max_size: 128
    idle_ttl_secs: 3600
    max_evictions_per_pass: 16
    protect_recent: 8
  # disabled_toolsets ниже оставлен ПУСТЫМ намеренно. У bfl (генерация
  # видео) и kanban (доска задач для нескольких агентов) есть собственный
  # check_fn — платный ключ BFL и верхнеуровневый toolsets: [kanban]
  # соответственно — и на машине клиента оба условия ложны сами по себе:
  # замер схемы даёт одно и то же число байт что с записью здесь, что без
  # неё. А вписать kanban сюда — вредно: disabled_toolsets применяется
  # последним и перекрыл бы штатное включение kanban через `toolsets:`,
  # если позже понадобится работа нескольких агентов над одной доской.
  # Эту дорогу оставляем открытой.
  max_turns: 500
  gateway_timeout: 1800
  gateway_turn_lease_timeout: 1800
  restart_drain_timeout: 0
  restart_after_turn_timeout: 21600
  build_wait_timeout: 600
  api_max_retries: 3
  service_tier: ''
  tool_use_enforcement: auto
  intent_ack_continuation: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true
  environment_hint: ''
  coding_context: auto
  coding_instructions: ''
  verify_guidance: true
  max_verify_nudges: 3
  verify_on_stop: false
  gateway_timeout_warning: 900
  clarify_timeout: 3600
  gateway_notify_interval: 180
  session_stall_timeout: 300
  gateway_auto_continue_freshness: 3600
  gateway_startup_restore_drain_timeout: 30
  local_stream_stale_timeout: 900
  image_input_mode: auto
  disabled_toolsets: []
  reasoning_overrides: {}

platform_toolsets:
  # Набор инструментов, доступных агенту в Telegram.
  # Чтобы вернуть что-то выключенное — допишите строку и перезапустите агента.
  telegram:
    - terminal          # выполнение команд в песочнице
    - file              # чтение, запись, правка, поиск по файлам
    - search            # веб-поиск (без web_extract — см. комментарий ниже)
    - browser           # открыть страницу, прочитать, нажать
    - vision            # разобрать присланную фотографию или скриншот
    - image_gen         # генерация картинок (заработает при ключе FAL_KEY)
    - tts               # голосовые ответы
    - memory            # долговременная память о вас
    - session_search    # поиск по прошлым разговорам
    - skills            # навыки агента, в том числе справка по продукту
    - cronjob           # задачи по расписанию
    - todo              # план работы внутри длинной задачи
    - clarify           # уточняющий вопрос вам
    - delegation        # подзадачи в отдельном контексте
    - code_execution    # выполнение кода в той же песочнице
    - secrets           # агент сам спросит недостающий ключ в чате
    - mcp               # агент подключает MCP-серверы по вашей просьбе в чате
    # Тулсет "web" (search + web_extract) заменён на "search": извлечение
    # страниц требует платного ключа (Firecrawl/Tavily/Exa), а без него
    # инструмент только зря тратит ход модели. Страницы агент читает
    # браузером. Если купите ключ — впишите его в .env и замените здесь
    # "search" на "web".

platforms:
  telegram:
    extra:
      command_menu:
        # Меню команд Telegram ("/") показывает только отобранный нами
        # клиентский список — остальные встроенные команды по-прежнему
        # работают, если набрать их вручную, а выключенные не исполняются
        # вовсе.
        #
        # Предел числа пунктов меню (max_commands) в этом файле НЕ задан
        # намеренно. Пока курирование включено (curated не выставлен в
        # false), предел выводится автоматически — он равен длине
        # клиентского списка и меняется сам при каждой правке этого
        # списка. Прописывать число руками здесь не нужно.
        #
        # Впишите max_commands сюда, только если сознательно хотите
        # РАСШИРИТЬ меню сверх клиентского списка — это уважаемое
        # переопределение, наш способ отладки на клиентской машине. Но
        # тогда curated-фильтр освобождает лишние слоты, и они тут же
        # заполняются командами навыков ПО АЛФАВИТУ — без разбора, какой
        # навык вообще уместен в продукте для клиента. На установке с
        # полным набором встроенных навыков туда попадают английские
        # служебные имена, macOS-навыки на Linux-сервере (/findmy,
        # /apple_notes, /apple_reminders) и /computer_use — тулсет которого
        # мы сами выключили строкой выше.
        #
        # Чтобы вернуть полностью некурированное меню (все встроенные
        # команды плюс слоты под навыки), впишите curated: false.

# Связь с Телеграмом: размер пула соединений и таймауты.
#
# Эти шесть чисел решают, насколько терпеливо бот ждёт Телеграм, когда
# сеть ведёт себя плохо. Значения ниже — ровно те, что действуют и без
# этой секции; она существует, чтобы их можно было поправить, не заходя
# на машину и не трогая .env.
#
# Все значения — секунды, кроме pool_size (число соединений). Клиент HTTP
# собирается один раз при подключении, поэтому правка вступает в силу
# после перезапуска шлюза.
#
# Переменные окружения HERMES_TELEGRAM_HTTP_* продолжают работать как
# аварийный обход, но написанное здесь главнее их: настройка, которую
# видно в файле, не должна молча проигрывать строке из .env.
telegram:
  network:
    # Сколько одновременных соединений к Telegram API держать. Больше —
    # ровнее идут параллельные отправки в людном чате, дороже по памяти
    # и файловым дескрипторам.
    pool_size: 512
    # Сколько ждать свободного соединения из пула, прежде чем признать
    # отправку неудачной. Библиотека по умолчанию ждёт 1 секунду — на
    # нестабильной сети этого мало, и отправка срывается там, где хватило
    # бы подождать.
    pool_timeout: 8
    # Сколько ждать установления соединения. Именно это число называет
    # сообщение об ошибке, когда Телеграм не отвечает совсем.
    connect_timeout: 10
    # Сколько ждать ответа на уже отправленный запрос.
    read_timeout: 20
    # Сколько ждать отправки обычного запроса — без файлов.
    write_timeout: 20
    # Отдельный таймаут на отправку ФАЙЛОВ. Это не дубль write_timeout:
    # библиотека уводит любой запрос с файлом сюда, и на write_timeout он
    # уже не смотрит. Считается не на всю загрузку целиком, а на каждую
    # запись в сокет, поэтому медленный, но ровный канал в него не
    # упирается — это запас на «залипания» связи, а не ограничение на
    # размер файла.
    media_write_timeout: 60
  reactions: false
  channel_prompts: {}
  allowed_chats: ''
  extra:
    rich_messages: false
    rich_drafts: false


# ──────────────────────────────────────────────────────────────────────────
# Дальше — разделы, которые мы не настраивали: всё на стандартных значениях
